name: ViralForge
options:
  bundleIdPrefix: com.phil
  schemePathPrefix: "../../../"
  postGenCommand: pod install
  deploymentTarget:
    iOS: "17.0"
fileGroups:
  - ViralForge.storekit
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "12"
    DEVELOPMENT_TEAM: 9SZ5257PF4
targets:
  ViralForge:
    type: application
    platform: iOS
    sources:
      - ViralForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phil.viralforge
        PRODUCT_NAME: ViralForge
        INFOPLIST_FILE: ViralForge/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        VIRALFORGE_ADS_ENABLED: "YES"
        VIRALFORGE_ADS_APP_OPEN_ENABLED: "YES"
        VIRALFORGE_ADS_REWARDED_TEXT_GENERATION_ENABLED: "YES"
        VIRALFORGE_ADS_TEXT_GENERATION_REWARD_DEBUG_GRANT_ENABLED: "NO"
        VIRALFORGE_ADS_NATIVE_FEED_ENABLED: "YES"
        VIRALFORGE_ADS_SHOW_DEBUG_FALLBACK_ADS: "NO"
        VIRALFORGE_ADS_APP_ID: "5827905"
        VIRALFORGE_ADS_APP_OPEN_PLACEMENT_ID: "104076071"
        VIRALFORGE_ADS_REWARDED_TEXT_GENERATION_PLACEMENT_ID: "104075974"
        VIRALFORGE_ADS_TEMPLATES_FEED_PLACEMENT_ID: "104076348"
        VIRALFORGE_ADS_PROJECTS_FEED_PLACEMENT_ID: "104076348"
        VIRALFORGE_ADS_HISTORY_FEED_PLACEMENT_ID: "104076348"
      configs:
        Debug:
          BACKEND_BASE_URL: "https://viralfo-backend-ipiunjbsno.cn-hangzhou.fcapp.run"
        Release:
          BACKEND_BASE_URL: "https://viralfo-backend-ipiunjbsno.cn-hangzhou.fcapp.run"
    scheme:
      testTargets:
        - ViralForgeUITests
      storeKitConfiguration: ViralForge.storekit
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
  ViralForgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ViralForgeUITests
    dependencies:
      - target: ViralForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phil.viralforge.uitests
        TEST_TARGET_NAME: ViralForge
        GENERATE_INFOPLIST_FILE: YES
