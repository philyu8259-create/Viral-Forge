    <h1>使用帮助</h1>
    <p>本页整理 ViralForge 常见问题排查步骤。</p>

    <h2>恢复购买</h2>
    <p>打开 ViralForge，进入设置页或会员页，点击“恢复购买”。请确认当前 Apple ID 与购买订阅时一致。</p>

    <h2>生成问题</h2>
    <p>如文案生成或 AI 背景生成失败，请检查网络并重试。免费版文案每天限额生成 3 次，次日重置；免费版 AI 背景生成一共 3 次，用完不重置。</p>

    <h2>数据删除</h2>
    <p>仅保存在本机的数据可通过卸载 App 删除，也可以在 App 设置页点击“清空本机工作台数据”。已生成项目可在项目页删除。</p>
